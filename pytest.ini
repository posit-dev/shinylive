[pytest]
testpaths = tests

# Each test boots an engine from scratch, and the assertions inside have their
# own tighter timeouts. This is the backstop for a hang.
timeout = 360
timeout_method = thread

# Every test carries either `examples` or `site`, and the two Make targets
# select on exactly that: the example suite is split by engine and sharded
# across CI jobs, while the site tests run once, next to the build they test.
markers =
    examples: a test over one of the apps in examples/
    site: a test of the built site or of a static export of it
    py: an example app running on Pyodide
    r: an example app running on webR
    allow_page_errors: a test that provokes page errors on purpose

addopts = --browser chromium --tracing retain-on-failure --output test-results
