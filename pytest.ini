[pytest]
testpaths = tests

# Each test boots an engine from scratch, and the assertions inside have their
# own tighter timeouts. This is the backstop for a hang.
timeout = 360
timeout_method = thread

# Every test carries either `examples` or `site`, and the two Make targets
# select on exactly that: the example suite is split by engine and sharded
# across CI jobs, while the site tests run once, next to the build they test.
markers =
    examples: a test over one of the apps in examples/
    site: a test of the built site or of a static export of it
    py: an example app running on Pyodide
    r: an example app running on webR
    allow_page_errors: a test that provokes page errors on purpose
    loader: a loader-status test; slow, and separable from the other site tests

# `-v -n 1` runs the tests one at a time in a single xdist worker. With `-v`,
# xdist prints each test's name on its own line when it starts and a result line
# when it finishes, so a long run (or a CI log) shows which test is running, not
# just which finished. Traces are recorded on CI only (see the Makefile), where
# they are the one way to see a failure after the fact; locally they cost about a
# tenth of the run time.
addopts = -v -n 1 --browser chromium --output test-results
