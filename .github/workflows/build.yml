name: Build and deploy shinylive

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_run:
    workflows: [Update py-shiny submodule]
    types:
      - completed
jobs:
  # TypeScript unit tests (jest)
  # Pure logic in src/, so no build needed.
  # App-level browser tests live in tests/ and run from the "Test example apps" workflow.
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write # uncovered-line annotations

    env:
      # Both coverage steps below need a write token: one to attach
      # uncovered-line annotations, the other to leave a PR comment. A PR from a
      # fork only gets a read token, so it skips them visibly instead of running
      # them and failing.
      REPORT_COVERAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      # Coverage is measured but never enforced: no threshold, and the figure
      # only covers the modules these tests import.
      - name: Measure coverage
        id: coverage
        if: env.REPORT_COVERAGE == 'true'
        # Third-party action holding a write token, so pinned for supply chain security. v2.3.1, 2024-09-09.
        uses: ArtiomTr/jest-coverage-report-action@7f750dd50f5585533321eb7ebc482b936b49a5d4
        with:
          annotations: coverage
          # Generate report as markdown and then publish separately below
          output: report-markdown

      # Kept separate from the comment below so the numbers survive on the run's
      # summary page even if posting the comment fails.
      - name: Add the coverage report to the run summary
        if: env.REPORT_COVERAGE == 'true' && steps.coverage.outputs.report != ''
        env:
          REPORT: ${{ steps.coverage.outputs.report }}
        run: printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      # `header` makes the comment sticky: a busy PR gets one comment updated in
      # place rather than one per push.
      - name: Publish the coverage report
        if: env.REPORT_COVERAGE == 'true' && steps.coverage.outputs.report != ''
        # Third-party action holding a write token, so pinned for supply chain security. v3.0.5, 2026-07-04.
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: jest-coverage-report
          # The same caveat the local run prints under its table: these figures
          # are unit coverage over the pure-logic modules, not the whole app.
          message: |
            > Unit tests only — the pure-logic modules in `src/`. The React components, hooks, engine proxies and service worker are covered by the pytest + Playwright suites in `tests/`, which are not measured here.

            ${{ steps.coverage.outputs.report }}

  build:
    needs: test-unit
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write  # Needed for svenstaro/upload-release-action
    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Check out submodules
        run: |
          make submodules

      - name: Build shinylive
        env:
          GOOGLE_TAG_MANAGER_ID: "GTM-KHBDBW7"
        run: |
          make all

      # The editor, apps loaded from the URL, and a static export, all against
      # the build produced above. They run here rather than in test-apps.yml
      # because that build is what they test, and a failure should stop the
      # deploy that follows.
      #
      # `make test-site` is `-m "site and not loader"`; the loader half runs in
      # test-loader.yml.
      - name: Run site and static export tests
        run: |
          make test-site

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-site-report
          path: test-results/
          retention-days: 30

      # =====================================================
      # Publish to AWS for shinylive.io
      # =====================================================
      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/deploy'
        uses: aws-actions/configure-aws-credentials@v5
        env:
          AWS_ACCOUNT_ID: "341745101194"
          AWS_REGION: us-east-1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ShinyliveDeploy
          role-session-name: gha-deploy-shinylive
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        if: github.ref == 'refs/heads/deploy'
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: "E2SN9UWE8YY9EG"
        run: |
          pip install awscli
          gzip -k _shinylive/r/shinylive/webr/R.wasm
          aws s3 sync _shinylive s3://shinylive.io --delete
          aws s3 cp --exclude "*" --include "*.data" --include "*.so" --recursive --content-type="application/wasm" --metadata-directive="REPLACE" s3://shinylive.io/r/shinylive/webr/ s3://shinylive.io/r/shinylive/webr/
          aws s3 cp --exclude "*" --include "*.js.metadata" --recursive --content-type="text/javascript" --metadata-directive="REPLACE" s3://shinylive.io/r/shinylive/webr/ s3://shinylive.io/r/shinylive/webr/
          aws s3 cp --content-encoding="gzip" --content-type="application/wasm" --metadata-directive="REPLACE" _shinylive/r/shinylive/webr/R.wasm.gz s3://shinylive.io/r/shinylive/webr/R.wasm
          aws cloudfront create-invalidation --distribution-id $AWS_CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

      # =====================================================
      # Upload _shinylive/ artifact
      # =====================================================
      - name: Upload _shinylive/ artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_shinylive/"

      # =====================================================
      # Upload shinylive bundle on release
      # =====================================================
      # Ensure that if the version in package.json is "0.0.5", then release tag
      # is "v0.0.5".
      - name: Check that version number matches release tag
        if: github.event_name == 'release'
        run: |
          if [ "${{github.ref}}" != refs/tags/v`node -p "require('./package.json').version"` ]; then
            echo Version in package.json, prepended with \"refs/tags/v\", is \"v`node -p "require('./package.json').version"`\", which does not match git tag \"${{github.ref}}\".
            exit 1
          fi

      - name: Build shinylive deployment bundle for release
        if: github.event_name == 'release'
        run: |
          make dist

      - name: Upload shinylive bundle to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "dist/*.tar.gz"
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true

  # =====================================================
  # Deploy GitHub Pages site
  # =====================================================
  deploy-gh-pages:
    if: github.ref == 'refs/heads/main'
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
