name: Build and deploy shinylive

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_run:
    workflows: [Update py-shiny submodule]
    types:
      - completed
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write  # Needed for svenstaro/upload-release-action
    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Check out submodules
        run: |
          make submodules

      - name: Build shinylive
        env:
          GOOGLE_TAG_MANAGER_ID: "GTM-KHBDBW7"
        run: |
          make all

      # =====================================================
      # Run the site tests
      # =====================================================
      # These drive the build produced by the step above: the editor, apps loaded
      # from the URL, and a static export. They run here rather than in
      # test-apps.yml because what they test is this build, and because a failure
      # should stop the deploy that follows.
      #
      # An earlier version of this ran the TypeScript playwright suite and was
      # commented out for years, because two of its specs shelled out to
      # `shinylive export` from the Python shinylive package -- which depends on
      # this repository, so it could only be updated after a release from here,
      # and a failure would then block the next release. tests/export_app.py
      # assembles an export out of build/ instead, so nothing here installs that
      # package.
      - name: Run site and static export tests
        run: |
          make site-test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-test-report
          path: test-results/
          retention-days: 30

      # =====================================================
      # Publish to AWS for shinylive.io
      # =====================================================
      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/deploy'
        uses: aws-actions/configure-aws-credentials@v5
        env:
          AWS_ACCOUNT_ID: "341745101194"
          AWS_REGION: us-east-1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ShinyliveDeploy
          role-session-name: gha-deploy-shinylive
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        if: github.ref == 'refs/heads/deploy'
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: "E2SN9UWE8YY9EG"
        run: |
          pip install awscli
          gzip -k _shinylive/r/shinylive/webr/R.wasm
          aws s3 sync _shinylive s3://shinylive.io --delete
          aws s3 cp --exclude "*" --include "*.data" --include "*.so" --recursive --content-type="application/wasm" --metadata-directive="REPLACE" s3://shinylive.io/r/shinylive/webr/ s3://shinylive.io/r/shinylive/webr/
          aws s3 cp --exclude "*" --include "*.js.metadata" --recursive --content-type="text/javascript" --metadata-directive="REPLACE" s3://shinylive.io/r/shinylive/webr/ s3://shinylive.io/r/shinylive/webr/
          aws s3 cp --content-encoding="gzip" --content-type="application/wasm" --metadata-directive="REPLACE" _shinylive/r/shinylive/webr/R.wasm.gz s3://shinylive.io/r/shinylive/webr/R.wasm
          aws cloudfront create-invalidation --distribution-id $AWS_CLOUDFRONT_DISTRIBUTION_ID --paths "/*"

      # =====================================================
      # Upload _shinylive/ artifact
      # =====================================================
      - name: Upload _shinylive/ artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_shinylive/"

      # =====================================================
      # Upload shinylive bundle on release
      # =====================================================
      # Ensure that if the version in package.json is "0.0.5", then release tag
      # is "v0.0.5".
      - name: Check that version number matches release tag
        if: github.event_name == 'release'
        run: |
          if [ "${{github.ref}}" != refs/tags/v`node -p "require('./package.json').version"` ]; then
            echo Version in package.json, prepended with \"refs/tags/v\", is \"v`node -p "require('./package.json').version"`\", which does not match git tag \"${{github.ref}}\".
            exit 1
          fi

      - name: Build shinylive deployment bundle for release
        if: github.event_name == 'release'
        run: |
          make dist

      - name: Upload shinylive bundle to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "dist/*.tar.gz"
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true

  # =====================================================
  # Deploy GitHub Pages site
  # =====================================================
  deploy_gh_pages:
    if: github.ref == 'refs/heads/main'
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
