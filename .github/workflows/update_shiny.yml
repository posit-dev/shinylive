name: Update shiny versions

# Moves the bundled window forward: recomputes shiny_versions.json from the
# PyPI and CRAN release lists, pins the py-shiny submodule to the newest
# Python release tag (the test controllers install from it), rebuilds the
# locks, and opens a pull request when anything changed.
#
# Pull requests opened with the default github.token do not trigger
# pull_request workflows. The repository secret UPDATE_SHINY_TOKEN (a
# fine-grained personal access token with contents and pull-requests write
# on this repo) gives the PR its CI checks. Without the secret the workflow
# still runs, but the PR has no checks. The checkout does not persist any
# credentials: only the push and the gh steps use the token.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  update-shiny:
    name: Update shiny versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tip of the update branch when this run started (empty when the
      # branch does not exist). The push below leases against it, so it fails
      # if anyone pushes to the branch while this run builds.
      - name: Record the update branch tip
        env:
          TOKEN: ${{ secrets.UPDATE_SHINY_TOKEN || github.token }}
        run: |
          TIP=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" refs/heads/update-shiny-versions | cut -f1)
          echo "UPDATE_BRANCH_TIP=$TIP" >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Check out submodules
        run: make submodules

      - name: Recompute shiny_versions.json
        run: python3 scripts/update_shiny_versions.py

      - name: Pin py-shiny to the newest bundled release
        run: |
          NEWEST=$(python3 -c "import json; print(next(iter(json.load(open('shiny_versions.json'))['python'].values())))")
          git -C packages/py-shiny fetch --tags
          git -C packages/py-shiny checkout "v$NEWEST"

      # `make all` only refreshes the local packages in the lock, so a move of
      # the window needs a full re-resolution of every bundled minor first.
      - name: Re-resolve shinylive_lock.json
        run: make update_packages_lock

      - name: Build shinylive
        run: make all

      - name: Set up git within GHA
        uses: actions4git/setup-git@v1

      # The branch is force-pushed with a lease on the tip recorded above, so
      # the push fails rather than overwrite commits pushed during this run.
      - name: Open a pull request when anything changed
        env:
          TOKEN: ${{ secrets.UPDATE_SHINY_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.UPDATE_SHINY_TOKEN || github.token }}
        run: |
          if git diff --quiet -- shiny_versions.json shinylive_lock.json packages/py-shiny; then
            echo "Nothing changed"
            exit 0
          fi
          BRANCH=update-shiny-versions
          git checkout -B "$BRANCH"
          git add shiny_versions.json shinylive_lock.json packages/py-shiny
          git commit --message "build: move the bundled shiny window forward"
          git push --force-with-lease="refs/heads/$BRANCH:$UPDATE_BRANCH_TIP" \
            "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" \
            "$BRANCH:refs/heads/$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "build: move the bundled shiny window forward"
          else
            gh pr create --fill --head "$BRANCH" --base main
          fi
